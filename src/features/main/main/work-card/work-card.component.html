<div *ngIf="work != null" class="container">
    <img *ngIf="(work.photoUrl | mimeType).includes('image')" class="work-photo" [src]="work.photoUrl" alt="Work photo">
    <video #video *ngIf="(work.photoUrl | mimeType).includes('video')" class="work-photo" [src]="work.photoUrl" muted autoplay loop playsinline (canplaythrough)="canPlayThrough($event)"></video>
    <div class="title">
        <h3 class="font-size-20">{{work.title | translate}}</h3>
    </div>
    <div class="description p-3">
        <p class="font-size-14 mb-4">{{work.description | translate}}</p>
        <div *ngIf="work.url != null && work.url != ''"><a [href]="work.url" class="my-button font-size-12">{{work.textButton | translate}}</a></div>
    </div>
</div>
