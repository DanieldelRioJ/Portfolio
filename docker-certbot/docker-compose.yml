version: '3'

services:
  nginx:
    build: .
    restart: unless-stopped
    environment:
      - CERTBOT_EMAIL:daniel.delrio.juncal@gmail.com
    env_file:
      - ./nginx-certbot.env
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./user_conf.d:/etc/nginx/user_conf.d

volumes:
  nginx_secrets:
